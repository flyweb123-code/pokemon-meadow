# 임시: 동혁 저장에서 아보(23) 부화 기록 읽기 (읽기만). 끝나면 지움.
name: tmp read egg
on:
  push:
    branches: [claude/project-thread-2v0p3m]
    paths: ['.github/workflows/tmp-read-egg.yml', 'tools/tmp/egg-read.mjs']
jobs:
  r:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      - name: Set D1 id
        run: |
          id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="pokegrow") | .uuid')
          sed -i "s/^database_id = .*/database_id = \"$id\"/" wrangler.toml
      - name: Read
        run: |
          npx wrangler d1 execute pokegrow --remote -y --json --command "SELECT acct, code, saved, parts, at FROM save WHERE acct='ehdgur4838'" > /tmp/s.json
          cat /tmp/s.json
          npx wrangler d1 execute pokegrow --remote -y --json --command "SELECT i, data FROM save_part WHERE acct='ehdgur4838' ORDER BY code, i" > /tmp/p.json
          npx wrangler d1 execute pokegrow --remote -y --json --command "SELECT slot, saved, dex, box, at FROM bak WHERE acct='ehdgur4838' ORDER BY slot" > /tmp/b.json
          cat /tmp/b.json
          npx wrangler d1 execute pokegrow --remote -y --json --command "SELECT slot, i, data FROM bak_part WHERE acct='ehdgur4838' ORDER BY slot, i" > /tmp/bp.json
          node ../tools/tmp/egg-read.mjs
