# 임시 (2026-11-19): D1 읽기 전용 — 동혁 관장 카드 라인업 확인. 확인 뒤 지움.
name: tmp card read
on:
  push:
    branches: [claude/project-thread-wlqncg]
    paths: ['.github/workflows/tmp-card-read.yml']
jobs:
  read:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Set D1 id
        run: |
          id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="pokegrow") | .uuid')
          sed -i "s/^database_id = .*/database_id = \"$id\"/" wrangler.toml
      - name: Read
        run: |
          npx wrangler d1 execute pokegrow --remote --json --command "SELECT code, best, card FROM score WHERE game='gymrep' AND code='MMUP5RAP'" | jq -c '.[0].results'
