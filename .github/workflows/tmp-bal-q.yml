# 임시: 승급 심사와 일반 도전자 승률 비교 (읽기만). 확인 뒤 지움
name: tmp bal query
on:
  push:
    branches: ['claude/project-thread-hj2ild']
    paths: ['.github/workflows/tmp-bal-q.yml']
permissions:
  contents: read
jobs:
  q:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
        working-directory: server
      - name: Set D1 id
        working-directory: server
        run: |
          id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="pokegrow") | .uuid')
          sed -i "s/^database_id = .*/database_id = \"$id\"/" wrangler.toml
      - name: Query
        working-directory: server
        run: |
          q() { npx wrangler d1 execute pokegrow --remote --json --command "$1" | jq -c '.[0].results[]'; }
          echo "== A by kind/diff/grade"
          q "SELECT json_extract(d,'\$.c') c, json_extract(d,'\$.df') df, json_extract(d,'\$.gr') gr, json_extract(d,'\$.bs') bs, count(*) n, sum(json_extract(d,'\$.w')) w, sum(json_extract(d,'\$.q')) q, round(avg(json_extract(d,'\$.fa')-json_extract(d,'\$.ma')),1) dlv, round(avg(json_extract(d,'\$.fn')),1) fn, round(avg(json_extract(d,'\$.stk')),1) stk, count(distinct code) u FROM bal WHERE kind='gym' GROUP BY 1,2,3,4 ORDER BY 3,1,2,4"
          echo "== B hard chal by grade and streak bucket"
          q "SELECT json_extract(d,'\$.gr') gr, CASE WHEN json_extract(d,'\$.stk')>=10 THEN '10+' WHEN json_extract(d,'\$.stk')>=5 THEN '5-9' ELSE '0-4' END sb, count(*) n, sum(json_extract(d,'\$.w')) w, round(avg(json_extract(d,'\$.fa')-json_extract(d,'\$.ma')),1) dlv, count(distinct code) u FROM bal WHERE kind='gym' AND json_extract(d,'\$.c')='chal' AND json_extract(d,'\$.df')>=1 GROUP BY 1,2 ORDER BY 1,2"
          echo "== C range"
          q "SELECT count(*) n, min(at) a0, max(at) a1, count(distinct code) u FROM bal WHERE kind='gym'"
