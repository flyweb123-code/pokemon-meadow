# 임시 (2026-11-13): D1 읽기 전용 — 경완 염무왕 노력치 확인. 확인 뒤 지움. (4)
name: tmp ev read
on:
  push:
    branches: [claude/project-thread-wlqncg]
    paths: ['.github/workflows/tmp-ev-read.yml']
jobs:
  read:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Set D1 id
        run: |
          id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="pokegrow") | .uuid')
          sed -i "s/^database_id = .*/database_id = \"$id\"/" wrangler.toml
      - name: Read
        run: |
          q() { npx wrangler d1 execute pokegrow --remote --json --command "$1"; }
          q "SELECT slot, code, saved, at, box FROM bak WHERE acct='flyweb' ORDER BY saved" > b.json
          jq -c '.[0].results[]' b.json
          for slot in $(jq -r '.[0].results[].slot' b.json); do
            q "SELECT data FROM bak_part WHERE acct='flyweb' AND slot='$slot' ORDER BY i" > p.json
            SL="$slot" node -e '
              const d=JSON.parse(require("fs").readFileSync("p.json"))[0].results.map(r=>r.data).join("");
              let S;try{S=JSON.parse(d)}catch(e){console.log("BK",process.env.SL,"parse fail");process.exit(0)}
              const P=(S.box||[]).find(p=>p.id===185), C=(S.box||[]).find(p=>p.id===3287), O=(S.box||[]).find(p=>p.id===166);
              console.log("BK",process.env.SL,new Date(S.savedAt).toISOString(),"n",(S.box||[]).length,"P185",JSON.stringify(P||null),"C3287",!!C,"P166",JSON.stringify(O||null).slice(0,300));'
          done
