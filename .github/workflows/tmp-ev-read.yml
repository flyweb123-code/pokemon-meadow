# 임시 (2026-11-13): D1 읽기 전용 — 경완 염무왕 노력치 확인. 확인 뒤 지움. (3)
name: tmp ev read
on:
  push:
    branches: [claude/project-thread-wlqncg]
    paths: ['.github/workflows/tmp-ev-read.yml']
jobs:
  read:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Set D1 id
        run: |
          id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="pokegrow") | .uuid')
          sed -i "s/^database_id = .*/database_id = \"$id\"/" wrangler.toml
      - name: Read
        run: |
          q() { npx wrangler d1 execute pokegrow --remote --json --command "$1"; }
          q "SELECT acct, code, saved FROM save WHERE acct='flyweb'" > sv.json
          cat sv.json | jq -c '.[0].results'
          for row in $(jq -r '.[0].results[] | "\(.acct)|\(.code)"' sv.json); do
            a=${row%%|*}; c=${row##*|}
            q "SELECT data FROM save_part WHERE acct='$a' AND code='$c' ORDER BY i" > p.json
            A="$a" C="$c" node -e '
              const d=JSON.parse(require("fs").readFileSync("p.json"))[0].results.map(r=>r.data).join("");
              let S;try{S=JSON.parse(d)}catch(e){console.log("SV",process.env.A,process.env.C,"parse fail");process.exit(0)}
              const g=S.gym||{}; console.log("SV",process.env.A,process.env.C,new Date(S.savedAt).toISOString(),"gym",g.nm,g.ty,g.rep,g.gmax);
              for(const P of (S.box||[]).filter(p=>p.sp===727)){ const m=(g.mon||{})[P.id]; console.log("P",JSON.stringify(P)); console.log("M",JSON.stringify(m&&{lv:m.lv,xp:m.xp,ev:m.ev,evp:m.evp,evM:m.evM,nat:m.nat,ws:m.ws})); }
              const lu=g.lu; console.log("LU",JSON.stringify(lu),g.luI);
              for(const id of [3287,185,3283,465]){ const P=(S.box||[]).find(p=>p.id===id); console.log("P",id,JSON.stringify(P).slice(0,700)); const m=(g.mon||{})[id]; console.log("M",id,JSON.stringify(m).slice(0,900)); console.log("TL",id,JSON.stringify((g.tlog||{})[id]||null).slice(0,600)); }
              console.log("GLOG",JSON.stringify((g.log||[]).filter(x=>/염무왕|500/.test(JSON.stringify(x))).slice(-15)).slice(0,2500)); console.log("SLOG",JSON.stringify((S.log||[]).filter(x=>/염무왕/.test(JSON.stringify(x))).slice(-15)).slice(0,2500)); console.log("DAYS",JSON.stringify(g.days||null).slice(0,1500));
              const bl=(g.blog||[]).map(b=>({t:new Date(b.t).toISOString(),foe:b.foe,won:b.won,pr:b.pr,v:b.v,out:b.out,fo:(b.fo||[]).map(x=>x[0]).join('/'),ko:(b.log||[]).filter(s=>/\|faint\||\|switch\|p1a/.test(s)).join(' ; ').slice(0,600)})); console.log("BLOG",JSON.stringify(bl));'
          done
