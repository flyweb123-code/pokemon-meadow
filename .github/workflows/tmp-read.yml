# 임시: 이벤트 자리 좌표 찾기 (OpenStreetMap). 끝나면 지움
name: tmp read
on:
  push:
    branches: [claude/project-thread-53n8vv]
    paths: ['.github/workflows/tmp-read.yml']
jobs:
  geo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests pillow numpy >/dev/null 2>&1 || true
      - run: python3 tools/ev-map.py --geo 'T 팩토리 성수' 'T팩토리 성수' 'T 팩토리' 'T팩토리' '성수역' || true
