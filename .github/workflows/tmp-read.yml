# 임시: 이벤트 자리 좌표 찾기 (OpenStreetMap). 끝나면 지움
name: tmp read
on:
  push:
    branches: [claude/project-thread-53n8vv]
    paths: ['.github/workflows/tmp-read.yml']
jobs:
  geo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cd tools && python3 -c "
          import importlib.util as u; s=u.spec_from_file_location('m','ev-map.py'); m=u.module_from_spec(s); s.loader.exec_module(m)
          for q in ['nwr[\"addr:street\"=\"연무장1길\"]', 'nwr[\"name\"~\"팩토리\"]', 'nwr[\"name\"=\"성수\"][\"railway\"]']:
              d=m.overpass('[out:json][timeout:60];area[\"ISO3166-1\"=\"KR\"]->.k;('+q+'(area.k););out center 20;')
              for el in d.get('elements',[]): c=el.get('center') or el; t=el.get('tags',{}); print('R', c.get('lat'), c.get('lon'), t.get('name'), t.get('addr:street'), t.get('addr:housenumber'))
          " || true
