# 임시 (2026-11-26 경완 '읽어도 돼'): 유찬님(NDN66BNL) 친구 필드 기록·저장 요약 읽기만. 끝나면 지움.
name: tmp read
on:
  push:
    branches: [claude/project-thread-7bljtv]
    paths: ['.github/workflows/tmp-read.yml']
jobs:
  r:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Set D1 id
        run: |
          id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="pokegrow") | .uuid')
          sed -i "s/^database_id = .*/database_id = \"$id\"/" wrangler.toml
      - name: read
        run: |
          q() { npx wrangler d1 execute pokegrow --remote -y --json --command "$1"; }
          q "SELECT i, data FROM save_part WHERE code = 'NDN66BNL' ORDER BY acct, i" > s.json
          q "SELECT slot, i, data FROM bak_part WHERE acct = 'u_chany' AND slot IN ('d2026-11-26','d2026-11-24') ORDER BY slot, i" > b.json
          node -e '
            const fs=require("fs");
            const d=JSON.parse(JSON.parse(fs.readFileSync("s.json"))[0].results.map(x=>x.data).join(""));
            console.log("logkeys", JSON.stringify(d.log[0]));
            for (const e of (d.log||[]).slice(0,70)) console.log(JSON.stringify(e).replace(/<[^>]+>/g,"").slice(0,200));
            console.log("thF", JSON.stringify(d.thF).slice(0,800));
            console.log("version", d.ver, d.appV, Object.keys(d.noti||{}).join(","));
            const rs=JSON.parse(fs.readFileSync("b.json"))[0].results, by={}; for (const r of rs) (by[r.slot] ||= []).push(r.data);
            for (const k in by) { const b=JSON.parse(by[k].join("")); console.log(k, "mons", JSON.stringify((b.mons||[]).map(m=>[m.sp,m.pid])), "thF.m", JSON.stringify(((b.thF||{}).m||{}).mons?.map(m=>[m.sp,m.pid]))); const B=new Set(d.box.map(P=>P.id)); const L=[...(b.mons||[]),...(((b.thF||{}).m||{}).mons||[])]; console.log(k,"still in box now", L.filter(m=>B.has(m.pid)).length, "/", L.length); }
          '
