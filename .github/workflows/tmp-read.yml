# 임시: 트레이너 등급 분포 읽기 (읽기만). 끝나면 지움.
name: tmp read
on:
  push:
    branches: [claude/project-thread-rdrvmy]
    paths: ['.github/workflows/tmp-read.yml']
jobs:
  read:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Set D1 id
        run: |
          id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="pokegrow") | .uuid')
          sed -i "s/^database_id = .*/database_id = \"$id\"/" wrangler.toml
      - name: Read
        run: |
          npx wrangler d1 execute pokegrow --remote --json --command "SELECT code, dex, at, json_extract(card,'$.n') AS n FROM trainer ORDER BY dex DESC" | jq -c '.[0].results[]'
