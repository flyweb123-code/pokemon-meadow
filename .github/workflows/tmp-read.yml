# 임시: D1 err 표 읽기 (배틀 중 앱 다시 켜짐 조사, 끝나면 지움)
name: tmp read
on:
  push:
    branches: [claude/project-thread-o7ens7]
    paths: ['.github/workflows/tmp-read.yml']
permissions:
  contents: read
jobs:
  r:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
        working-directory: server
      - working-directory: server
        run: |
          id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="pokegrow") | .uuid')
          sed -i "s/^database_id = .*/database_id = \"$id\"/" wrangler.toml
          q() { npx wrangler d1 execute pokegrow --remote --json --command "$1" | jq -c '.[0].results[]' | fold -w 3000; }
          echo "=== pk-btl"; q "SELECT k, msg, ver, beta, n, length(codes)-length(replace(codes,',',''))+1 AS users, at0, at, st, issue, ctx FROM err WHERE where_ = 'pk-btl'"
          echo "=== recent err"; q "SELECT k, msg, substr(where_,1,120) w, ver, n, at, st, issue FROM err WHERE at > 1795000000000 ORDER BY at DESC LIMIT 40"
