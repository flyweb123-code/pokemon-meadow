name: tmp read dorm
on:
  push:
    branches: [claude/project-thread-cmpc3f]
jobs:
  read:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Set D1 id
        run: |
          id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="pokegrow") | .uuid')
          sed -i "s/^database_id = .*/database_id = \"$id\"/" wrangler.toml
      - name: Read
        run: |
          q() { npx wrangler d1 execute pokegrow --remote --json --command "$1" | jq -c '.[0].results[]'; }
          echo "== accounts"; q "SELECT a.id, a.code, a.at AS acct_at, s.at AS save_at, s.saved, t.at AS card_at, t.dex, u.gold, u.box FROM account a LEFT JOIN save s ON s.acct=a.id LEFT JOIN trainer t ON t.code=a.code LEFT JOIN acct_sum u ON u.acct=a.id"
          echo "== trainers"; q "SELECT code, at, dex FROM trainer ORDER BY at"
          echo "== bal days"; q "SELECT code, date(at/1000+32400,'unixepoch') AS d, COUNT(*) AS n FROM bal GROUP BY code, d ORDER BY code, d"
          echo "== bak days"; q "SELECT acct, slot, dex, gold, at FROM bak WHERE slot LIKE 'd%' ORDER BY acct, slot"
          echo "== ped"; q "SELECT code, st, lw, n, at FROM ped"
          echo "== push"; q "SELECT * FROM push LIMIT 0" ; q "SELECT COUNT(*) n FROM push"
