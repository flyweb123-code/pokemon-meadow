name: tmp read gengar
on:
  push:
    branches: [claude/project-thread-oarifm]
    paths: ['.github/workflows/tmp-read.yml']
jobs:
  r:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Set D1 id
        run: |
          id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="pokegrow") | .uuid')
          sed -i "s/^database_id = .*/database_id = \"$id\"/" wrangler.toml
      - name: Read
        run: |
          for a in flyweb test; do
          npx wrangler d1 execute pokegrow --remote -y --json --command "SELECT p.i, p.data FROM save_part p JOIN (SELECT code FROM save WHERE acct='$a' ORDER BY saved DESC, at DESC LIMIT 1) s ON p.code=s.code WHERE p.acct='$a' ORDER BY p.i" > /tmp/$a.json || true
          node -e "
          const r=JSON.parse(require('fs').readFileSync('/tmp/$a.json','utf8'));const rows=(r[0]||r).results||[];const S=JSON.parse(rows.map(x=>x.data).join(''));
          console.log('== $a', 'ver', S.ver||S.v, 'box', S.box.length);
          const mon=(S.gym&&S.gym.mon)||{};
          S.box.filter(P=>[92,93,94].includes(+P.sp)).forEach(P=>console.log(JSON.stringify({id:P.id,sp:P.sp,nm:P.nm,rk:P.rk||P.r,m:mon[P.id]})));
          const lu=(S.gym&&S.gym.lu)||[];console.log('lu',JSON.stringify(lu));
          "
          done
