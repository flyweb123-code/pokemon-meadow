name: tmp read minippung
on:
  push:
    branches: [claude/project-thread-kpunrv]
    paths: ['.github/workflows/tmp-read.yml']
jobs:
  r:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Set D1 id
        run: |
          id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="pokegrow") | .uuid')
          sed -i "s/^database_id = .*/database_id = \"$id\"/" wrangler.toml
      - name: read
        run: |
          q(){ npx wrangler d1 execute pokegrow --remote -y --json --command "$1"; }
          echo ==ERR; q "SELECT k,msg,where_,ver,beta,n,at0,at,st,issue,substr(ctx,1,3000) AS ctx FROM err WHERE codes LIKE '%AED4P7MD%' ORDER BY at DESC LIMIT 15"
          echo ==ERRRECENT; q "SELECT k,msg,where_,ver,n,at,st,codes FROM err ORDER BY at DESC LIMIT 15"
          echo ==BAL; q "SELECT id,kind,ver,beta,t,at,substr(d,1,600) AS d FROM bal WHERE code='AED4P7MD' ORDER BY at DESC LIMIT 25"
          q "SELECT i,data FROM save_part WHERE code='AED4P7MD' ORDER BY i" > /tmp/sp.json || true
          jq -r '.[0].results | map(.data) | join("")' /tmp/sp.json > /tmp/s.json || true
          echo ==SAVE; ls -la /tmp/s.json; jq -c '{ver:.ver, savedAt:.savedAt, errs:.errs, gymKeys:(.gym|keys?)}' /tmp/s.json || head -c 500 /tmp/s.json
          echo ==SAVEMETA; q "SELECT code, at, length(data) FROM save WHERE code='AED4P7MD'" || true
