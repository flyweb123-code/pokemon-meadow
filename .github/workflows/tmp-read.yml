# 임시(2): 배틀 중 앱 다시 켜짐 조사 — 겪은 계정 저장을 암호화해서만 꺼냄 (공개 저장소라 기록엔 크기만). 끝나면 지움
name: tmp read
on:
  push:
    branches: [claude/project-thread-o7ens7]
    paths: ['.github/workflows/tmp-read.yml']
permissions:
  contents: read
jobs:
  r:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
        working-directory: server
      - working-directory: server
        run: |
          id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="pokegrow") | .uuid')
          sed -i "s/^database_id = .*/database_id = \"$id\"/" wrangler.toml
          q() { npx wrangler d1 execute pokegrow --remote --json --command "$1" | jq -c '.[0].results'; }
          codes=$(q "SELECT codes FROM err WHERE k = 'd24e8959c002999d0ad2358a'" | jq -r '.[0].codes')
          code=${codes%%,*}
          q "SELECT acct, code, parts, at FROM save WHERE code = '$code' ORDER BY at DESC LIMIT 1" > /tmp/meta.json
          acct=$(jq -r '.[0].acct' /tmp/meta.json)
          q "SELECT i, data FROM save_part WHERE acct = '$acct' AND code = '$code' ORDER BY i" | jq -j '.[].data' > /tmp/save.txt
          echo "parts $(jq -r '.[0].parts' /tmp/meta.json) size $(wc -c < /tmp/save.txt)"
          echo "" | base64 -d > /tmp/pub.pem
          head -c 32 /dev/urandom | xxd -p -c 64 > /tmp/k.txt
          mkdir -p /tmp/out
          gzip -c /tmp/save.txt | openssl enc -aes-256-cbc -pbkdf2 -pass file:/tmp/k.txt -out /tmp/out/save.enc
          openssl pkeyutl -encrypt -pubin -inkey /tmp/pub.pem -in /tmp/k.txt -out /tmp/out/k.enc
          rm /tmp/k.txt /tmp/save.txt
          echo KEY; base64 -w 0 /tmp/out/k.enc; echo; echo DATA; base64 -w 0 /tmp/out/save.enc | fold -w 4000; echo; echo END
