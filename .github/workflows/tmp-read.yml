# 임시 (2026-11-26 경완 '읽어도 돼'): 유찬님(NDN66BNL) 친구 필드 기록·저장 요약 읽기만. 끝나면 지움.
name: tmp read
on:
  push:
    branches: [claude/project-thread-7bljtv]
    paths: ['.github/workflows/tmp-read.yml']
jobs:
  r:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Set D1 id
        run: |
          id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="pokegrow") | .uuid')
          sed -i "s/^database_id = .*/database_id = \"$id\"/" wrangler.toml
      - name: read
        run: |
          q() { npx wrangler d1 execute pokegrow --remote -y --json --command "$1"; }
          q "SELECT slot, saved, dex, box, at FROM bak WHERE acct = 'u_chany' ORDER BY at DESC" | jq -c '.[0].results[]'
          q "SELECT slot, i, data FROM bak_part WHERE acct = 'u_chany' ORDER BY slot, i" > b.json
          q "SELECT i, data FROM save_part WHERE code = 'NDN66BNL' ORDER BY acct, i" > s.json
          node -e '
            const fs=require("fs"); const T=t=>t?new Date(t+9*3600e3).toISOString().slice(5,16):"-";
            const sum=(tag,d)=>{ console.log(tag,"saved",T(d.savedAt),"th",d.th,"mons",(d.mons||[]).length,"thF",Object.entries(d.thF||{}).map(([k,t])=>k+":"+(t.mons||[]).length+"@"+T(t.t)).join(" "),"box",(d.box||[]).length,"lay",JSON.stringify(d.lay||{}).length); };
            const rs=JSON.parse(fs.readFileSync("b.json"))[0].results, by={}; for (const r of rs) (by[r.slot] ||= []).push(r.data);
            for (const k of Object.keys(by).sort()) { try { sum("bak "+k, JSON.parse(by[k].join(""))); } catch(e){ console.log(k,"err",e.message); } }
            const d=JSON.parse(JSON.parse(fs.readFileSync("s.json"))[0].results.map(x=>x.data).join(""));
            sum("now",d);
            console.log("log:"); for (const e of (d.log||[]).slice(0,40)) console.log(T(e.t||e.at), String(e.html||"").replace(/<[^>]+>/g,"").slice(0,120));
            console.log("errs", JSON.stringify(d.errs||[]).slice(0,1500));
            console.log("fbag", JSON.stringify(d.fbag||null).slice(0,400), "fbagT", JSON.stringify(d.fbagT||null).slice(0,600));
          '
