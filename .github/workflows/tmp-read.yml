# 임시: 똥빵귀 저장 읽기 (읽기만). 끝나면 지움
name: tmp read
on:
  push:
    branches: [claude/project-thread-3s97md]
    paths: ['.github/workflows/tmp-read.yml', 'tools/tmp/**']
jobs:
  read:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Set D1 id
        run: |
          id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="pokegrow") | .uuid')
          sed -i "s/^database_id = .*/database_id = \"$id\"/" wrangler.toml
      - name: Read
        run: |
          q() { npx wrangler d1 execute pokegrow --remote --json --command "$1"; }
          q "SELECT code, plat, env, kinds, at FROM push WHERE code='PF575BHN'"
          q "SELECT ver, beta, kind, t, substr(d,1,200) d FROM bal WHERE code='PF575BHN' ORDER BY t DESC LIMIT 6"
          q "SELECT msg, ver, at, substr(ctx,1,300) c FROM err WHERE codes LIKE '%PF575BHN%' ORDER BY at DESC LIMIT 10"
