# 임시 읽기 (2026-11-10): u_chany 가 앱을 다시 켰는지 확인. 끝나면 지움
name: tmp read u_chany 2
on:
  push:
    branches: [claude/project-thread-1ji9et]
jobs:
  r:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Set D1 id
        run: |
          id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="pokegrow") | .uuid')
          sed -i "s/^database_id = .*/database_id = \"$id\"/" wrangler.toml
      - name: Read
        run: |
          ex() { npx wrangler d1 execute pokegrow --remote -y --json --command "$1" | jq -c '.[0].results[]'; }
          ex "SELECT acct, code, saved, parts, at FROM save WHERE acct = 'u_chany'"
          ex "SELECT code, dex, wk, wkm, json_extract(card,'$.n') n, at FROM trainer WHERE code = 'NDN66BNL'"
          ex "SELECT acct, slot, dex, box, gold, at FROM bak WHERE acct = 'u_chany'"
          ex "SELECT acct, dex, box, at FROM acct_sum WHERE acct = 'u_chany'"
          ex "SELECT code, game, best, at FROM score WHERE code = 'NDN66BNL' ORDER BY at DESC LIMIT 3"
          ex "SELECT code, kind, ver, at FROM bal WHERE code = 'NDN66BNL' ORDER BY at DESC LIMIT 3"
          npx wrangler d1 execute pokegrow --remote -y --json --command "SELECT data FROM save_part WHERE acct='u_chany' AND code='NDN66BNL' ORDER BY i" | jq -r '.[0].results | map(.data) | join("")' | jq -c '{savedAt, nick: .tr.n, dex: ((.unlocked//[])|length), box: ((.box//[])|length), gold}'
