# 임시: 오류 표 읽기 (읽고 지움)
name: tmp read err
on:
  push:
    branches: [claude/project-thread-wlqncg]
    paths: ['.github/workflows/tmp-read.yml']
jobs:
  r:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Set D1 id
        run: |
          id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="pokegrow") | .uuid')
          sed -i "s/^database_id = .*/database_id = \"$id\"/" wrangler.toml
      - name: Read
        run: |
          npx wrangler d1 execute pokegrow --remote -y --json --command "SELECT k,msg,where_,ver,beta,n,codes,datetime(at0/1000,'unixepoch') a0,datetime(at/1000,'unixepoch') a1,st,issue,substr(ctx,1,3000) ctx FROM err ORDER BY at DESC LIMIT 12"
