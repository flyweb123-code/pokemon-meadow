# 임시: 똥빵귀 저장 읽기 (읽기만). 끝나면 지움
name: tmp read
on:
  push:
    branches: [claude/project-thread-3s97md]
    paths: ['.github/workflows/tmp-read.yml', 'tools/tmp/**']
jobs:
  read:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Set D1 id
        run: |
          id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="pokegrow") | .uuid')
          sed -i "s/^database_id = .*/database_id = \"$id\"/" wrangler.toml
      - name: Read
        run: |
          q() { npx wrangler d1 execute pokegrow --remote --json --command "$1"; }
          q "SELECT id, code, dev, at FROM account WHERE id LIKE '%donggo%'"
          q "SELECT code, at, json_extract(card,'$.n') AS n FROM trainer WHERE code='PF575BHN' OR card LIKE '%똥빵귀%'"
          q "SELECT acct, code, saved, parts, at FROM save WHERE code='PF575BHN'"
          q "SELECT acct, slot, saved, dex, box, gold, at FROM bak WHERE code='PF575BHN' ORDER BY slot"
          q "SELECT * FROM acct_sum WHERE acct LIKE '%donggo%'"
          q "SELECT kind, COUNT(*) n, MAX(t) last FROM bal WHERE code='PF575BHN' GROUP BY kind"
          q "SELECT data FROM save_part WHERE code='PF575BHN' ORDER BY i" > /tmp/parts.json
          q "SELECT slot, i, data FROM bak_part WHERE acct='donggo' ORDER BY slot, i" > /tmp/bak.json
          node ../tools/tmp/sum.js /tmp/parts.json /tmp/bak.json
