name: tmp read minippung
on:
  push:
    branches: [claude/project-thread-kpunrv]
    paths: ['.github/workflows/tmp-read.yml']
jobs:
  r:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Set D1 id
        run: |
          id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="pokegrow") | .uuid')
          sed -i "s/^database_id = .*/database_id = \"$id\"/" wrangler.toml
      - name: read
        run: |
          q(){ npx wrangler d1 execute pokegrow --remote -y --json --command "$1"; }
          echo ==ACCT; q "SELECT id,code,dev,at FROM account WHERE code='AED4P7MD'"
          echo ==BAK; q "SELECT slot,saved,dex,box,gold,at FROM bak WHERE code='AED4P7MD' ORDER BY at DESC LIMIT 12"
          echo ==SAVEROW; q "SELECT saved,parts,at FROM save WHERE code='AED4P7MD'"
          q "SELECT i,data FROM save_part WHERE code='AED4P7MD' ORDER BY i" > /tmp/sp.json
          jq -r '.[0].results | map(.data) | join("")' /tmp/sp.json > /tmp/s.json
          echo ==LOG; jq -c '.gym.log[:25][] | [(.[0]/1000|floor), .[1], .[2][:140]]' /tmp/s.json
          echo ==Q; jq -c '.gym.q' /tmp/s.json | head -c 3000; echo
          echo ==LU; jq -c '{lu:.gym.lu, luI:.gym.luI, at:.gym.at, d:.gym.d, gmax:.gym.gmax, rep:.gym.rep, stk:.gym.stk, lstk:.gym.lstk, ms:.gym.ms, mg:.gym.mgRing, z:.gym.zRing, mons:(.mons|length), box:(.box|length), tr:.tr}' /tmp/s.json | head -c 3000; echo
          echo ==TOP; jq -c 'to_entries | map({k:.key, n:(.value|tostring|length)}) | sort_by(-.n) | .[:15]' /tmp/s.json
