# 임시: 경완 계정 저장 읽기 (읽기만, 끝나면 지움)
name: tmp read
on:
  push:
    branches: [claude/tmp-read-flyweb]
jobs:
  r:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Set D1 id
        run: |
          id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="pokegrow") | .uuid')
          sed -i "s/^database_id = .*/database_id = \"$id\"/" wrangler.toml
      - name: Read
        run: |
          npx wrangler d1 execute pokegrow --remote -y --json --command "SELECT code, i, data FROM save_part WHERE acct = 'flyweb' ORDER BY code, i" > /tmp/p.json
          node -e '
          const r=require("/tmp/p.json")[0].results; const by={}; for(const x of r){(by[x.code]=by[x.code]||[]).push(x.data)}
          for(const [c,L] of Object.entries(by)){ let S; try{S=JSON.parse(L.join(""))}catch(e){console.log(c,"parse fail");continue}
            const box=S.box||[]; console.log("code",c,"box",box.length,"gym ty",S.gym&&S.gym.ty, "gyms", JSON.stringify((S.gyms||[]).map(g=>g.ty)));
            const P=box.find(p=>+p.sp===10230); console.log("P", JSON.stringify(P)); console.log("mon", JSON.stringify(S.gym&&S.gym.mon&&S.gym.mon[P&&P.id]));
            console.log("dup", box.filter(p=>p.id===(P&&P.id)).length, "idx", box.indexOf(P), "savedAt", S.savedAt, "ver", S.ver||S.appVer||S.v, "lu", JSON.stringify(S.gym.lu));
            const sk=Object.keys(S).filter(k=>/ver|app|V$/i.test(k)); console.log("verkeys", JSON.stringify(sk.map(k=>[k,typeof S[k]==="object"?"obj":S[k]])));
            console.log("unlocked has 59", (S.unlocked||[]).includes(59), (S.unlocked||[]).includes(10230));
          }'
