# 임시 (유저 지표판 스레드): D1 읽기만. 끝나면 지움.
name: tmp metrics read
on:
  push:
    branches: [claude/project-thread-cj8evh]
    paths: ['.github/workflows/tmp-metrics.yml', 'tools/metrics/**']
jobs:
  read:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
        working-directory: server
      - name: Set D1 id
        working-directory: server
        run: |
          id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="pokegrow") | .uuid')
          sed -i "s/^database_id = .*/database_id = \"$id\"/" wrangler.toml
      - run: node tools/metrics/yuchan.mjs
