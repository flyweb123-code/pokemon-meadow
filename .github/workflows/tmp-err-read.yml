# 임시 (2026-11-25): D1 err 표 읽기 전용 — 경완 '방금 배틀하다가 꺼짐'. 확인 뒤 지움.
name: tmp err read
on:
  push:
    branches: [claude/project-thread-hiatsa]
    paths: ['.github/workflows/tmp-err-read.yml']
jobs:
  read:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Set D1 id
        run: |
          id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="pokegrow") | .uuid')
          sed -i "s/^database_id = .*/database_id = \"$id\"/" wrangler.toml
      - name: Read
        run: |
          npx wrangler d1 execute pokegrow --remote --json --command "SELECT k, msg, where_, ver, beta, ctx, n, codes, at0, at FROM err ORDER BY at DESC LIMIT 12" > e.json
          node -e 'for (const r of JSON.parse(require("fs").readFileSync("e.json"))[0].results) console.log("ERR", new Date(r.at).toISOString(), r.ver, r.beta, r.n, r.codes, "|", r.msg, "|", r.where_, "|", String(r.ctx).slice(0, 1500));'
