# 2026-11-10 경완 '포켓몬 쌓기 랭킹 기록도 초기화': 친구 서버 랭킹에서 탑 쌓기(stack, 주간 stackW…) 기록을 지운다. 한 번만 쓰는 작업 — Actions 화면에서 직접 실행.
name: Reset stack ranking

on:
  workflow_dispatch:

jobs:
  reset:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Set D1 id
        run: |
          id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="pokegrow") | .uuid')
          sed -i "s/^database_id = .*/database_id = \"$id\"/" wrangler.toml
      - name: Count and delete
        run: |
          npx wrangler d1 execute pokegrow --remote -y --command "SELECT game, COUNT(*) AS n, MAX(best) AS top FROM score WHERE game = 'stack' OR game LIKE 'stackW%' GROUP BY game"
          npx wrangler d1 execute pokegrow --remote -y --command "DELETE FROM score WHERE game = 'stack' OR game LIKE 'stackW%'"
          npx wrangler d1 execute pokegrow --remote -y --command "SELECT COUNT(*) AS left_rows FROM score WHERE game = 'stack' OR game LIKE 'stackW%'"
