# 안드로이드 앱 APK 만들기: android/ 폴더가 바뀌면 GitHub 이 대신 빌드한다 (맥·Android Studio 없이).
# - 어느 브랜치든: Actions 실행 화면 아래 Artifacts 에 pokegrow-android (APK) 가 생긴다.
# - main 에 합쳐지면: Releases 의 'android-latest' 에 pokegrow.apk 를 올린다 → 폰에서 바로 받아 설치.
name: Android APK

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        working-directory: android
        env:
          KAKAO_KEY: ${{ secrets.KAKAO_KEY }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}   # 친구 방문 푸시 (없으면 푸시만 빠짐)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../pokegrow.apk
      - uses: actions/upload-artifact@v4
        with:
          name: pokegrow-android
          path: pokegrow.apk
      - name: Publish to release android-latest
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest --title "안드로이드 앱 (최신)" --notes "포켓에그 안드로이드 앱. 폰에서 pokegrow.apk 를 받아 설치하세요." --prerelease
          # 앱이 켤 때 보는 최신 버전 번호 (AppUpdate.kt). versionCode = 이 워크플로 실행 번호
          echo "{\"code\": ${{ github.run_number }}, \"name\": \"1.0.${{ github.run_number }}\"}" > android-version.json
          gh release upload android-latest pokegrow.apk android-version.json --clobber
