name: tmp ghost check 2
on:
  push:
    branches: [claude/project-thread-7bxa63]
    paths: ['.github/workflows/tmp-ghost2.yml']
jobs:
  chk:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Set D1 id
        run: |
          id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="pokegrow") | .uuid')
          sed -i "s/^database_id = .*/database_id = \"$id\"/" wrangler.toml
      - name: Dump
        run: |
          npx wrangler d1 execute pokegrow --remote -y --json --command "SELECT s.acct, s.code, s.at, p.i, p.data FROM save s JOIN save_part p ON p.acct=s.acct AND p.code=s.code WHERE s.acct='flyweb' ORDER BY p.i" > /tmp/all.json
          npx wrangler d1 execute pokegrow --remote -y --json --command "SELECT slot, saved, dex, box FROM bak WHERE acct='flyweb' ORDER BY slot" > /tmp/bak.json || true
          cat > /tmp/a.js <<'JS'
          const R = JSON.parse(require('fs').readFileSync('/tmp/all.json','utf8'))[0].results, d = [];
          for (const r of R) d[r.i] = r.data; const S = JSON.parse(d.join('')), box = S.box;
          const IDS = [112, 122, 330, 409];
          const walk = (o, path) => { if (o && typeof o === 'object') { for (const [k, v] of Object.entries(o)) { if (k === 'log' || k === 'days') continue; if (IDS.includes(+k)) console.log('KEY', path + '.' + k); walk(v, path + '.' + k); } } else if (IDS.includes(o)) console.log('VAL', path, o); };
          walk(S.gym, 'gym'); walk({ mons: S.mons, buds: S.buds }, 'S');
          for (const p of box.filter(p => [859, 860, 861, 736, 737, 738, 66, 67, 68].includes(p.sp))) console.log('BOX', p.id, p.sp, new Date(p.t).toISOString(), p.t, 'g', p.g, 'place', p.place, 'fr', p.fr | 0, 'km', p.km | 0);
          for (const id of IDS) { const m = S.gym?.mon?.[id]; console.log('GMON', id, JSON.stringify(m || null).slice(0, 300)); }
          const L = (S.log || []).filter(e => /메롱꿍|쏘겨모|오롱털/.test(e.html)).slice(0, 10).map(e => e.html.replace(/<[^>]+>/g, ''));
          console.log('LOG', JSON.stringify(L));
          JS
          node /tmp/a.js
          cat /tmp/bak.json | head -c 2000
