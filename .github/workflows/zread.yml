name: zread
on:
  push:
    branches: [claude/project-thread-5eaq6n]
    paths: ['.github/workflows/zread.yml']
jobs:
  r:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Set D1 id
        run: |
          id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="pokegrow") | .uuid')
          sed -i "s/^database_id = .*/database_id = \"$id\"/" wrangler.toml
      - name: Read
        run: |
          npx wrangler d1 execute pokegrow --remote -y --json --command "SELECT i, data FROM save_part WHERE acct='flyweb' ORDER BY i" > /tmp/p.json
          npx wrangler d1 execute pokegrow --remote -y --json --command "SELECT slot, saved, dex, box, at FROM bak WHERE acct='flyweb' ORDER BY at DESC LIMIT 8" > /tmp/b.json
          npx wrangler d1 execute pokegrow --remote -y --json --command "SELECT slot, i, data FROM bak_part WHERE acct='flyweb' AND slot IN (SELECT slot FROM bak WHERE acct='flyweb' ORDER BY at DESC LIMIT 3) ORDER BY slot, i" > /tmp/bp.json
          node -e '
          const fs=require("fs");
          const sum=(S,tag)=>{console.log("==",tag,"saved",S.saved||S.at,"totalKm",S.totalKm,"walkKm",S.walkKm,"fedPend",S.fedPend,"ped",JSON.stringify(S.ped),"undo1",S.undo1,"since",S.since,"box",(S.box||[]).length);
            console.log("eggs",JSON.stringify((S.eggs||[]).map(e=>[e.id,e.g,+(+e.km).toFixed(3),e.need,e.t])));
            console.log("fedLog",JSON.stringify((S.fedLog||[]).slice(-12)));
            console.log("runs",JSON.stringify((S.runs||[]).slice(-4)).slice(0,800));
            console.log("log",JSON.stringify((S.log||[]).slice(0,30).map(a=>[a.t||a.at,String(a.html||a.text||a.m||"").replace(/<[^>]+>/g,"").slice(0,70)])));
            console.log("errs",JSON.stringify((S.errs||[]).slice(-6)).slice(0,1200));};
          const r=JSON.parse(fs.readFileSync("/tmp/p.json","utf8"))[0].results;sum(JSON.parse(r.map(x=>x.data).join("")),"NOW");
          console.log("BAK",JSON.stringify(JSON.parse(fs.readFileSync("/tmp/b.json","utf8"))[0].results));
          const bp=JSON.parse(fs.readFileSync("/tmp/bp.json","utf8"))[0].results;const by={};for(const x of bp)(by[x.slot]||=[]).push(x.data);
          for(const k in by){try{sum(JSON.parse(by[k].join("")),"BAK "+k)}catch(e){console.log("bad",k,e.message)}}
          '
