name: tmp dup check
on:
  push:
    branches: [claude/project-thread-7bxa63]
    paths: ['.github/workflows/tmp-dupchk.yml']
jobs:
  chk:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Set D1 id
        run: |
          id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="pokegrow") | .uuid')
          sed -i "s/^database_id = .*/database_id = \"$id\"/" wrangler.toml
      - name: Dump
        run: |
          npx wrangler d1 execute pokegrow --remote -y --json --command "SELECT s.acct, s.code, s.at, p.i, p.data FROM save s JOIN save_part p ON p.acct=s.acct AND p.code=s.code ORDER BY s.acct, p.i" > /tmp/all.json
          cat > /tmp/a.js <<'JS'
          const R = JSON.parse(require('fs').readFileSync('/tmp/all.json','utf8'))[0].results, A = {};
          for (const r of R) (A[r.acct + '|' + r.code] ||= { at: r.at, d: [] }).d[r.i] = r.data;
          for (const [k, v] of Object.entries(A)) { let S; try { S = JSON.parse(v.d.join('')); } catch (e) { console.log(k, 'parse fail'); continue; }
            const box = S.box || [], cnt = {}; for (const p of box) cnt[p.id] = (cnt[p.id] || 0) + 1;
            const dup = Object.entries(cnt).filter(([, n]) => n > 1);
            const sameT = {}; for (const p of box) { const t = p.t + '|' + (p.iv || []).join(','); (sameT[t] ||= []).push(p.id + ':' + p.sp); }
            const twins = Object.values(sameT).filter(x => x.length > 1);
            const maxId = Math.max(0, ...box.map(p => p.id || 0));
            console.log(k, 'at', new Date(v.at).toISOString(), 'box', box.length, 'eid', S.eid, 'maxId', maxId, 'dupIds', dup.length, JSON.stringify(dup.slice(0, 10).map(([id, n]) => [id, n, box.filter(p => p.id == id).map(p => p.sp + (p.t ? '@' + new Date(p.t).toISOString().slice(0,16) : ''))])), 'twins(t+iv)', twins.length, JSON.stringify(twins.slice(0, 10)), 'ver', S.ver || S.appVer || '');
            const ghost = box.filter(p => p.g == null && !p.place && !p.fr && !p.km && !p.nm).map(p => p.id + ':' + p.sp + '@' + new Date(p.t || 0).toISOString().slice(5, 16) + (p.shiny ? 'S' : ''));
            console.log('  ghosts', ghost.length, JSON.stringify(ghost.slice(-40)));
          }
          JS
          node /tmp/a.js

