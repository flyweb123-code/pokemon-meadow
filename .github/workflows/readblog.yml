# 임시: 경완 저장의 마지막 배틀 기록만 읽기 (읽기 전용, 2026-11-07). 다 보면 지움.
name: Read battle log
on:
  push:
    branches: [claude/project-thread-wlqncg]
    paths: ['.github/workflows/readblog.yml']
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
        working-directory: server
      - name: Read
        working-directory: server
        run: |
          id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="pokegrow") | .uuid')
          sed -i "s/^database_id = .*/database_id = \"$id\"/" wrangler.toml
          npx wrangler d1 execute pokegrow --remote --json --command "SELECT code, saved, parts FROM save WHERE acct='flyweb' ORDER BY saved DESC LIMIT 1" > s.json
          code=$(jq -r '.[0].results[0].code' s.json)
          npx wrangler d1 execute pokegrow --remote --json --command "SELECT i, data FROM save_part WHERE acct='flyweb' AND code='$code' ORDER BY i" > p.json
          node -e '
            const r = JSON.parse(require("fs").readFileSync("p.json","utf8"))[0].results; let t = r.map(x => x.data).join("");
            let S; try { S = JSON.parse(t); } catch (e) { console.log("not json", t.slice(0, 80)); process.exit(0); }
            if (S.S) S = S.S; const b = (S.gym && S.gym.blog) || [];
            console.log("ver", S.ver || S.appVer, "blogs", b.length);
            for (const x of b.slice(0, 2)) { const y = Object.assign({}, x); const log = y.log; delete y.log; console.log(JSON.stringify(y).slice(0, 3000)); console.log("LOG:"); console.log((Array.isArray(log) ? log.join("\n") : String(log)).slice(-12000)); console.log("-----"); }
            console.log("ERRS", JSON.stringify((S.errs || []).slice(0, 8)));
          '
