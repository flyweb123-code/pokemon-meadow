# 임시: 골드 쌓임 표를 지금 데이터로 한 번 찍어 봄 (이슈 안 만듦). 확인 뒤 지움.
name: Tmp gold accumulation
on:
  push:
    branches: [claude/project-thread-mso1k8]
    paths: [.github/workflows/tmp-gold.yml]
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
        working-directory: server
      - name: Set D1 id
        working-directory: server
        run: |
          id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="pokegrow") | .uuid')
          sed -i "s/^database_id = .*/database_id = \"$id\"/" wrangler.toml
      - run: node tools/bal-report.mjs --print | sed -n '/## 골드 (한/,/## 지역 알/p;/## 눈여겨볼/,/## 체육관 배틀/p'
