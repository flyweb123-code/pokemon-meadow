# 유저 지표판 (경완 2026-11-28 '1 반영' · '둘 다 해 줘'): 매주 D1 을 읽기만 해서 metrics.json 을 산출물(user-metrics, 14일)로 남긴다.
# 월요일 예약 작업이 산출물을 받아 tools/metrics/build.py 로 지표판 Artifact(Az4RsmntFRwBjQ8CJpA32u)를 새로 채운다.
name: User metrics

on:
  schedule:
    - cron: '13 0 * * 1'   # 매주 월요일 09:13 KST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
        working-directory: server
      - name: Set D1 id
        working-directory: server
        run: |
          id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="pokegrow") | .uuid')
          sed -i "s/^database_id = .*/database_id = \"$id\"/" wrangler.toml
      - run: node tools/metrics/extract.mjs metrics.json
      - run: python3 tools/metrics/build.py metrics.json out
      - uses: actions/upload-artifact@v4
        with:
          name: user-metrics
          path: |
            metrics.json
            out/
          retention-days: 14
