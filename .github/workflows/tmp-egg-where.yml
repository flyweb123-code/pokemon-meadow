name: tmp egg where
on:
  push:
    branches: [claude/project-thread-7y1yb6]
    paths: ['.github/workflows/tmp-egg-where.yml']
jobs:
  r:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
        working-directory: server
      - working-directory: server
        run: |
          id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="pokegrow") | .uuid')
          sed -i "s/^database_id = .*/database_id = \"$id\"/" wrangler.toml
      - run: |
          node tools/tmp-egg-where.mjs > o.json 2>/dev/null
          openssl rand -hex 32 > k.txt
          openssl enc -aes-256-cbc -pbkdf2 -pass file:k.txt -in o.json -out o.enc
          echo "KEY $(openssl pkeyutl -encrypt -pubin -inkey tools/tmp-pub.pem -in k.txt | base64 -w0)"
          echo "DAT $(base64 -w0 o.enc)"
          rm -f o.json k.txt
