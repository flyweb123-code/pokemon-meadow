# 임시: 경완 저장 읽기 (필드 배치 시안용, 읽기 전용) — 끝나면 지움
name: tmp read save
on:
  push:
    branches: [claude/project-thread-5eaq6n]
    paths: ['.github/workflows/tmp-read-save.yml']
jobs:
  read:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Set D1 id
        run: |
          id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="pokegrow") | .uuid')
          sed -i "s/^database_id = .*/database_id = \"$id\"/" wrangler.toml
      - name: Read
        run: |
          npx wrangler d1 execute pokegrow --remote -y --json --command "SELECT acct, code, i, data FROM save_part WHERE code = '2X392NYD' ORDER BY i" > /tmp/save.json
          ls -la /tmp/save.json
      - name: Print field part
        run: |
          node -e "const R=JSON.parse(require('fs').readFileSync('/tmp/save.json','utf8'))[0].results;const A={};for(const r of R)(A[r.acct]=A[r.acct]||[]).push(r);let best=null;for(const k in A){try{const S=JSON.parse(A[k].sort((a,b)=>a.i-b.i).map(r=>r.data).join(''));console.log('ACCT',k,S.savedAt,(S.mons||[]).length);if(!best||(S.savedAt||0)>(best.savedAt||0))best=S}catch(e){console.log('ACCT',k,'bad')}}const S=best;const o=JSON.stringify({lay:S.lay,layAdd:S.layAdd,fbag:S.fbag,clock:S.clock,base:S.base,mons:S.mons});for(let i=0;i<o.length;i+=4000)console.log('FLD'+String(i/4000).padStart(4,'0')+' '+o.slice(i,i+4000));"
