name: tmp geo
on:
  push:
    branches: [claude/project-thread-7y1yb6]
    paths: ['.github/workflows/tmp-geo.yml']
jobs:
  geo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pillow && python3 tools/ev-map.py --geo '아르코예술극장' '日本橋三井タワー' '東京ミッドタウン八重洲' 'コレド室町1' '마로니에공원'
