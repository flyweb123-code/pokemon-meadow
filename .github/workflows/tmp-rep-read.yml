# 임시 (2026-11-10): D1 읽기 전용 — 트레이너 이름·체육관 평판 확인. 확인 뒤 지움.
name: tmp rep read
on:
  push:
    branches: [claude/project-thread-vkkyjg]
    paths: ['.github/workflows/tmp-rep-read.yml']
jobs:
  read:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Set D1 id
        run: |
          id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="pokegrow") | .uuid')
          sed -i "s/^database_id = .*/database_id = \"$id\"/" wrangler.toml
      - name: Read
        run: |
          q() { npx wrangler d1 execute pokegrow --remote --json --command "$1"; }
          q "SELECT code, card, at FROM trainer" > tr.json
          q "SELECT id, code, at FROM account" > ac.json
          q "SELECT acct, code, saved, parts FROM save" > sv.json
          node -e '
            const tr=JSON.parse(require("fs").readFileSync("tr.json"))[0].results;
            for(const r of tr){let c={};try{c=JSON.parse(r.card)}catch(e){} console.log("TR",r.code,JSON.stringify(c.n),JSON.stringify(c.gym&&{nm:c.gym.nm,ty:c.gym.ty,gi:c.gym.gi}),new Date(r.at).toISOString());}
            const ac=JSON.parse(require("fs").readFileSync("ac.json"))[0].results;
            for(const r of ac) console.log("AC",r.id,r.code);'
          for row in $(jq -r '.[0].results[] | "\(.acct)|\(.code)"' sv.json); do
            a=${row%%|*}; c=${row##*|}
            q "SELECT data FROM save_part WHERE acct='$a' AND code='$c' ORDER BY i" > p.json
            A="$a" C="$c" node -e '
              const d=JSON.parse(require("fs").readFileSync("p.json"))[0].results.map(r=>r.data).join("");
              let S;try{S=JSON.parse(d)}catch(e){console.log("SV",process.env.A,process.env.C,"parse fail");process.exit(0)}
              const g=S.gym||{};
              console.log("SV",process.env.A,process.env.C,JSON.stringify({nick:S.nick??S.name??S.tn,savedAt:S.savedAt&&new Date(S.savedAt).toISOString(),gym:{nm:g.nm,ty:g.ty,rep:g.rep,gmax:g.gmax,big:g.big,d:g.d}}));'
          done
