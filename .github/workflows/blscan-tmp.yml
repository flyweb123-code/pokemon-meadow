# 임시: 춤추새 알 백업 확인 (읽기만). 확인 끝나면 지움.
name: blscan tmp
on:
  push:
    branches: [claude/project-thread-wlqncg]
    paths: ['.github/workflows/blscan-tmp.yml', 'tools/tmp/blscan.mjs']
jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Set D1 id
        run: |
          id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="pokegrow") | .uuid')
          sed -i "s/^database_id = .*/database_id = \"$id\"/" wrangler.toml
      - name: Read
        run: |
          npx wrangler d1 execute pokegrow --remote --json --command "SELECT slot, i, data FROM bak_part WHERE acct = 'flyweb' AND slot IN (SELECT slot FROM bak WHERE acct = 'flyweb' AND at > 1794780000000)" > /tmp/parts.json
          npx wrangler d1 execute pokegrow --remote --json --command "SELECT slot, saved, at FROM bak WHERE acct = 'flyweb' ORDER BY at DESC LIMIT 8"
          node ../tools/tmp/blscan.mjs /tmp/parts.json
