# 일회용 읽기 (2) (경완 OK 2026-11-05): 라인업만 출력. 끝나면 지움
name: rd-lu
on:
  push:
    branches: [claude/project-thread-wlqncg]
    paths: ['.github/workflows/rd-lu.yml', 'tools/rd/**']
jobs:
  rd:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - working-directory: server
        run: |
          npm ci >/dev/null
          id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="pokegrow") | .uuid')
          sed -i "s/^database_id = .*/database_id = \"$id\"/" wrangler.toml
          npx wrangler d1 execute pokegrow --remote --json --command "SELECT code, i, data FROM save_part WHERE acct = 'flyweb'" > /tmp/r.json || { head -c 600 /tmp/r.json; exit 1; }
          node ../tools/rd/lu.mjs /tmp/r.json
