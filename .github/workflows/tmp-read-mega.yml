# 임시: 동혁 저장·배틀 기록에서 킬라플로르 메가 읽기 (읽기만). 끝나면 지움.
name: tmp read mega
on:
  push:
    branches: [claude/project-thread-wprkd3]
    paths: ['.github/workflows/tmp-read-mega.yml', 'tools/tmp/mega-read.mjs']
jobs:
  r:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults: { run: { working-directory: server } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      - name: Set D1 id
        run: |
          id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="pokegrow") | .uuid')
          sed -i "s/^database_id = .*/database_id = \"$id\"/" wrangler.toml
      - name: Read
        run: |
          npx wrangler d1 execute pokegrow --remote -y --json --command "SELECT i, data FROM save_part WHERE acct='ehdgur4838' ORDER BY code, i" > /tmp/p.json
          npx wrangler d1 execute pokegrow --remote -y --json --command "PRAGMA table_info(bal)"
          npx wrangler d1 execute pokegrow --remote -y --json --command "SELECT * FROM bal WHERE acct='ehdgur4838' ORDER BY rowid DESC LIMIT 300" > /tmp/bal.json || echo '[{"results":[]}]' > /tmp/bal.json
          node ../tools/tmp/mega-read.mjs
