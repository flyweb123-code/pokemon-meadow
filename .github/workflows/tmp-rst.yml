# 임시 (2026-11-10 경완 '되돌려줘' → 'B를 안전하게'): u_chany 계정 저장을 D1 시간 되돌리기로 꺼내 다시 넣는다. 끝나면 이 파일은 지움
# 안전장치: 1) 시작 전 DB 전체를 export 해서 Actions 산출물로 남김 2) 되돌린 상태에선 읽기만, 바로 원래 북마크로 복귀 (실패해도 trap 으로 복귀)
name: tmp restore u_chany
on:
  push:
    branches: [claude/project-thread-1ji9et]
jobs:
  r:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN: ${{ secrets.SERVER_ADMIN_TOKEN }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Set D1 id
        run: |
          id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="pokegrow") | .uuid')
          sed -i "s/^database_id = .*/database_id = \"$id\"/" wrangler.toml
      - name: Full backup first
        run: npx wrangler d1 export pokegrow --remote --output=full-backup.sql && ls -la full-backup.sql
      - uses: actions/upload-artifact@v4
        with:
          name: d1-full-backup-20261110
          path: server/full-backup.sql
          retention-days: 14
      - name: Time travel, copy, restore back
        run: |
          set -e
          ex() { npx wrangler d1 execute pokegrow --remote -y --json --command "$1"; }
          NOW=$(npx wrangler d1 time-travel info pokegrow --json | jq -r '.bookmark')
          echo "now bookmark $NOW"; test -n "$NOW" && test "$NOW" != null
          back() { echo "restore back to $NOW"; for i in 1 2 3 4 5; do npx wrangler d1 time-travel restore pokegrow --bookmark="$NOW" --json && return 0; sleep 3; done; return 1; }
          trap back EXIT
          ok=0
          for T in 2026-11-10T07:09:00Z 2026-11-09T17:00:00Z; do
            npx wrangler d1 time-travel restore pokegrow --timestamp="$T" --json
            ex "SELECT acct, code, sig, saved, parts, at FROM save WHERE acct = 'u_chany' AND code = 'NDN66BNL'" | jq '.[0].results[0]' > row.json
            ex "SELECT i, data FROM save_part WHERE acct = 'u_chany' AND code = 'NDN66BNL' ORDER BY i" | jq -j '.[0].results | map(.data) | join("")' > data.txt
            n=$(jq '(.unlocked // []) | length' data.txt || echo 0)
            echo "at $T: row $(jq -c '{saved,parts,at}' row.json) unlocked $n nick $(jq -r '.tr.n' data.txt) box $(jq '(.box // [])|length' data.txt)"
            if [ "$n" -ge 20 ]; then ok=1; break; fi
          done
          trap - EXIT; back
          test "$ok" = 1
          echo "after restore back (newest trainer rows should be from just now):"; ex "SELECT code, json_extract(card,'$.n') n, at FROM trainer ORDER BY at DESC LIMIT 3" | jq -c '.[0].results[]'
      - name: Put the old save back
        run: |
          set -e
          AT=$(($(date +%s) * 1000))
          for C in RSTNDN66 NDN66BNL; do
            jq -n --rawfile d data.txt --slurpfile r row.json --arg c "$C" --argjson at "$AT" '{table:"save", rows:[{acct:"u_chany", code:$c, sig:$r[0].sig, saved:$r[0].saved, at:$at, data:$d}]}' > body.json
            curl -sS -f -X POST https://pokegrow.flyweb123.workers.dev/admin/import -H "authorization: Bearer $ADMIN" -H 'content-type: application/json' --data-binary @body.json; echo
          done
          npx wrangler d1 execute pokegrow --remote -y --json --command "SELECT acct, code, saved, parts, at FROM save WHERE acct = 'u_chany'" | jq -c '.[0].results[]'
