# 임시 읽기 (2026-11-10): u_chany 초기화 원인 찾기 — 지금 서버에 있는 저장들 요약만 읽는다. 끝나면 지움
name: tmp read u_chany
on:
  push:
    branches: [claude/project-thread-1ji9et]
jobs:
  r:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Set D1 id
        run: |
          id=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="pokegrow") | .uuid')
          sed -i "s/^database_id = .*/database_id = \"$id\"/" wrangler.toml
      - name: Read
        run: |
          ex() { npx wrangler d1 execute pokegrow --remote -y --json --command "$1"; }
          ex "SELECT acct, code, saved, parts, at FROM save WHERE acct = 'u_chany'" | jq -c '.[0].results[]'
          ex "SELECT acct, code, saved, at FROM save ORDER BY at DESC LIMIT 12" | jq -c '.[0].results[]'
          ex "SELECT id, code, dev IS NOT NULL AS hasdev, substr(dev,1,8) AS dv, at FROM account WHERE id = 'u_chany'" | jq -c '.[0].results[]'
          ex "SELECT k, msg, where_, ver, n, at0, at, codes FROM err ORDER BY at DESC LIMIT 15" | jq -c '.[0].results[]'
          ex "SELECT code, kind, ver, beta, at FROM bal WHERE code = 'NDN66BNL' ORDER BY at DESC LIMIT 15" | jq -c '.[0].results[]'
          ex "SELECT code, plat, env, at FROM push WHERE code = 'NDN66BNL'" | jq -c '.[0].results[]' || true
          ex "SELECT code, game, best, at FROM score WHERE code = 'NDN66BNL' ORDER BY at DESC LIMIT 5" | jq -c '.[0].results[]'
