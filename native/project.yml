# 포켓몬 키우기 아이폰 앱 + 애플워치 앱. Mac 에서 `xcodegen` 을 실행하면 PokeRun.xcodeproj 가 만들어진다.
name: PokeRun
options:
  bundleIdPrefix: com.flyweb123
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  # 앱 언어를 한국어로: 애플 지도의 장소 이름(식당·공원 등)이 영어 대신 한국어로 온다
  developmentLanguage: ko
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  PokeRun:
    type: application
    platform: iOS
    sources: [PokeRun]
    info:
      path: PokeRun/Info.plist
      properties:
        CFBundleDisplayName: 포켓몬 키우기
        CFBundleDevelopmentRegion: ko
        CFBundleLocalizations: [ko]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIViewControllerBasedStatusBarAppearance: false
        UIStatusBarStyle: UIStatusBarStyleLightContent
        LSApplicationQueriesSchemes: [shortcuts]
        # 걷거나 뛰는 동안 휴대폰이 잠겨 있어도 250m마다 장소 이름을 받는다 (WalkTracker.setTracking)
        UIBackgroundModes: [location]
        ITSAppUsesNonExemptEncryption: false
        NSMotionUsageDescription: 걸은 거리만큼 가방에 알을 넣으려고 걸음 기록을 읽어요.
        NSLocationWhenInUseUsageDescription: 알을 어느 동네에서 주웠는지 남기려고 위치를 써요.
        NSLocationAlwaysAndWhenInUseUsageDescription: 휴대폰이 잠겨 있어도 걸으면 알을 줍고, 주운 동네를 남기려고 위치를 써요.
        NSHealthShareUsageDescription: 애플워치나 다른 앱으로 달린 기록을 런닝 기록과 알에 반영하려고 건강 앱의 운동 기록을 읽어요.
    entitlements:
      path: PokeRun/PokeRun.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flyweb123.pokerun
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: PokeRunWatch

  PokeRunWatch:
    type: application
    platform: watchOS
    sources: [PokeRunWatch]
    info:
      path: PokeRunWatch/Info.plist
      properties:
        CFBundleDisplayName: 포켓몬 키우기
        CFBundleDevelopmentRegion: ko
        CFBundleLocalizations: [ko]
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.flyweb123.pokerun
        WKBackgroundModes: [workout-processing]
        NSHealthShareUsageDescription: 달린 거리를 알에 쌓으려고 건강 데이터를 읽어요.
        NSHealthUpdateUsageDescription: 런닝을 운동 기록으로 저장해요.
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: PokeRunWatch/PokeRunWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flyweb123.pokerun.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        # 아이폰 앱에 담겨 갈 때도 옛 워치(SE 1세대 등 arm64_32)용 코드를 같이 넣는다
        ONLY_ACTIVE_ARCH: NO
